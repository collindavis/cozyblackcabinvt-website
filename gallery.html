<div class="lb" id="lb" aria-hidden="true">
  <button class="x" id="lbClose" aria-label="Close">×</button>
  <button class="prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="next" id="lbNext" aria-label="Next">›</button>
</div>

<footer class="site-footer">
  <div class="wrap footer-bottom" style="border:0;padding-top:0">
    <span>© <span id="year"></span> Cozy Black Cabin VT · Brownsville, Vermont</span>
    <a href="https://www.instagram.com/cozyblackcabinvt" target="_blank" rel="noopener" style="color:#cabfae;text-decoration:none">@cozyblackcabinvt</a>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const items = [...document.querySelectorAll('.g-item')];
  const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
  let idx = 0;
  function open(i){idx=(i+items.length)%items.length;lbImg.src=items[idx].getAttribute('href');lbImg.alt=items[idx].querySelector('img').alt;lb.classList.add('open');lb.setAttribute('aria-hidden','false');}
  function close(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');lbImg.src='';}
  items.forEach((a,i)=>a.addEventListener('click',e=>{e.preventDefault();open(i);}));
  document.getElementById('lbClose').onclick=close;
  document.getElementById('lbPrev').onclick=()=>open(idx-1);
  document.getElementById('lbNext').onclick=()=>open(idx+1);
  lb.addEventListener('click',e=>{if(e.target===lb)close();});
  document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')open(idx-1);if(e.key==='ArrowRight')open(idx+1);});
</script>
